# Plantilla de bug (US-12.01, #272). «¿Cómo se ha encontrado?» alimenta la métrica de bugs encontrados por tests:
# el workflow «Métricas de tests» pone una etiqueta hallado-* según la respuesta. No cambies los textos de las opciones
# sin cambiar también ORIGENES en .github/scripts/bugs.mjs.
name: Bug
description: Algo que ya está integrado (en una rama de historia, en develop o en main) no funciona como dicen sus criterios.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Un fallo que encuentras mientras haces tu propia tarea, antes de integrarla, no es un bug: arréglalo y sigue.
        El arreglo va en una rama `bugfix/<nº de este issue>-<desc>` (o `hotfix/` si ya está en `main`) y **tiene que incluir el test que lo reproduce**.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Sin sesión, ir a /buscar?q=taladro
        2. Pulsar «Iniciar sesión» en la cabecera
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia afectada
      placeholder: 'US-04.01 Solicitar un alquiler (#60)'
    validations:
      required: true
  - type: dropdown
    id: origen
    attributes:
      label: ¿Cómo se ha encontrado?
      options:
        - Un test automático en local (unitario, de API o e2e)
        - El CI de un PR
        - Revisión de código
        - Probando a mano
        - En producción o en la demo
    validations:
      required: true
  - type: input
    id: test
    attributes:
      label: Test que lo detectó
      description: Solo si lo encontró un test. Si no, el test que lo reproduce se añade en el PR del arreglo.
      placeholder: 'e2e/tests/solicitar-alquiler.spec.ts › Criterio 3'
