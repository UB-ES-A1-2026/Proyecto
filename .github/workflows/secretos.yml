# Busca secretos (claves, tokens, contraseñas) en el historial con gitleaks (#100, TR-07).
# El repo es público: cualquier clave que llegue a GitHub hay que darla por filtrada (docs/secretos.md).
# Usamos el binario oficial y no gitleaks-action, que pide licencia de pago en repos de organizaciones.
# Generado con asistencia de IA (Claude) – revisado por Marc Sanz, 25/10/2026
name: Secretos

on:
  pull_request:
    branches: [develop, main, 'feature/**']
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: secretos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto borrado en un commit posterior sigue estando en el anterior.
          fetch-depth: 0

      - name: Instalar gitleaks (comprobando el checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks

      - name: Buscar secretos en todo el historial
        run: ./gitleaks git . --redact --verbose --exit-code 1
