# Bugs encontrados por tests (#272):
# - Al crear o editar un bug, le pone la etiqueta hallado-* según «¿Cómo se ha encontrado?» (plantilla bug.yml).
# - Un PR de bugfix/ o hotfix/ tiene que cambiar algún test y enlazar su issue de bug.
# La lógica está en .github/scripts/bugs.mjs.
# Generado con asistencia de IA (Claude) – revisado por Marc Sanz, 5/11/2026
name: Bugs

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  origen:
    name: Origen del bug
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/bugs.mjs etiqueta "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

  test-del-arreglo:
    name: Test del arreglo
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'bugfix/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/bugs.mjs arreglo "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
