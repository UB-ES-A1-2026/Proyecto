services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rentit
      POSTGRES_PASSWORD: rentit
      POSTGRES_DB: rentit
    ports:
      - "5432:5432"
    volumes:
      - rentit-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentit -d rentit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rentit-db-data:
