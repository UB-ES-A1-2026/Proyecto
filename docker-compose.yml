services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rentit
      POSTGRES_PASSWORD: rentit
      POSTGRES_DB: rentit
    ports:
      # Solo accesible desde este ordenador: con "5432:5432" la BD quedaría abierta
      # a toda la red (por ejemplo, el wifi de la universidad) con la contraseña rentit.
      # Se publica en IPv4 y en IPv6 local porque en Windows (y con Node 17+) «localhost»
      # se resuelve primero a ::1, y los .env usan localhost.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - rentit-db-data:/var/lib/postgresql/data
      # Los scripts de docker/postgres/init (crean rentit_test) solo se ejecutan la primera
      # vez, al crear el volumen. Si falta rentit_test: docker compose down -v && docker compose up -d
      # (-v borra los datos locales).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentit -d rentit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rentit-db-data:
