<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taquilla del barrio · SP-05</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
  integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1"
  crossorigin="anonymous"></script>
<style>
  body { font-family: system-ui; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; text-align: center }
  #door { padding: 1rem; border-radius: .5rem; background: #e5e7eb; font-size: 1.3rem; margin-bottom: 1rem }
  #door.open { background: #1a7f37; color: #fff }
  button { font-size: 1rem; padding: .6rem 1.2rem }
  #qr svg { width: 16rem; height: 16rem }
  code { word-break: break-all; font-size: .75rem }
</style>
</head>
<body>
<h1>Taquilla 3</h1>
<div id="door">Cerrada</div>
<button id="nuevo">Generar código de recogida</button>
<div id="qr"></div>
<p id="info"></p>
<p><a href="/escanear">Escáner en el navegador (BarcodeDetector)</a></p>
<script>
const door = document.getElementById('door')
document.getElementById('nuevo').onclick = async () => {
  const c = await (await fetch('/api/codigos', { method: 'POST' })).json()
  const qr = qrcode(0, 'M')
  qr.addData(c.url)
  qr.make()
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })
  document.getElementById('info').innerHTML =
    'Escanéalo con la cámara del móvil.<br>Caduca: ' + new Date(c.expiresAt).toLocaleString('es-ES') +
    '<br><code>' + c.url + '</code>'
  door.className = ''; door.textContent = 'Cerrada'
}
// La «puerta» se abre en esta pantalla cuando el móvil consume el código.
let last = 0
setInterval(async () => {
  const list = await (await fetch('/api/estado')).json()
  const used = Math.max(0, ...list.map((e) => e.usedAt ?? 0))
  if (used > last) { last = used; door.className = 'open'; door.textContent = 'Taquilla 3 abierta' }
}, 1000)
</script>
</body>
</html>
